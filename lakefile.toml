name = "Riehl"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Riehl"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # copyright ヘッダ要求は個人プロジェクトに適合しない（CLAUDE.md 参照）
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

[[lean_lib]]
name = "Riehl"
